name: Limit Guard Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # ----------------------------------------------------
  # STAGE 1: CI (Проверка и тестирование)
  # ----------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests with Maven (Testcontainers included)
        run: chmod +x ./mvnw && ./mvnw clean test

  # ----------------------------------------------------
  # STAGE 2: CD (Сборка Docker-образа и Деплой)
  # ----------------------------------------------------
  build-and-deploy:
    name: Build Image & Deploy to Prod
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/limits-guard-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/limits-guard-service:${{ github.sha }}

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /app

            # 1. Обновляем файлы конфигурации (docker-compose.yml и т.д.)
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin master
            fi

            # 2. Пересоздаем .env файл прямо на сервере из секретов или переменных
            cat << 'EOF' > .env
            DB_PORT=${{ secrets.DB_PORT }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_NAME=${{ secrets.DB_NAME }}
            REDIS_PASS=${{ secrets.REDIS_PASS }}
            REDIS_PORT=${{ secrets.REDIS_PORT }}
            IMAGE_TAG=${{ github.sha }}
            EOF

            # 3. Подтягиваем свежие образы и перезапускаем без тяжелой сборки
            docker compose pull
            docker compose up -d

            # 4. Очищаем старые неиспользуемые образы
            docker image prune -f