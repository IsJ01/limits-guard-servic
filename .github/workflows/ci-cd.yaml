name: Limit Guard Pipeline

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
jobs:
  # ----------------------------------------------------
  # STAGE 1: CI (Проверка и тестирование)
  # ----------------------------------------------------
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests with Maven (Testcontainers included)
        run: ./mvnw clean test

  # ----------------------------------------------------
  # STAGE 2: CD (Сборка Docker-образа и Деплой)
  # ----------------------------------------------------
  build-and-deploy:
    name: Build Image & Deploy to Prod
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/limits-guard-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/limits-guard-service:${{ github.sha }}

      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Переходим в папку проекта на сервере
            cd /app/limits-guard
            
            # Скачиваем свежий образ из Docker Hub
            docker compose -f docker-compose.yaml pull app
            
            # Перезапускаем сервис с обновленным образом без простоя других сервисов
            docker compose -f docker-compose.yaml up -d app
            
            # Очищаем старые неиспользуемые образы
            docker image prune -f
